[project]
name = "bookmarks"
version = "0.1.0"
description = "A simple bookmark manager for Django"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-extensions>=4.1",
    "django-taggit>=6.1.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
]



[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "ipython>=9.16.1",
]
[tool.uv]
package = false
