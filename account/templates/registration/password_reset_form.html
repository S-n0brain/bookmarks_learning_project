{% extends 'base.html' %}
{% block title %}
  Reset your password
{% endblock %}
{% block content %}
  <h1>Forgotten your password?</h1>
  <p>Enter your e-mail address to obtain a new password.</p>
  <form method="post" action="{% url 'account:password_reset' %}">
    {{ form.as_div }}
    <p>
      <input type="submit" value="Send e-mail" />
    </p>
    {% csrf_token %}
  </form>
{% endblock %}
