{% extends 'base.html' %}
{% block title %}
  Change your password
{% endblock %}
{% block content %}
  <h1>Change your password</h1>
  <p>Use the form below to change your password.</p>
  <form method="post" action="{% url 'account:password_change' %}">
    {{ form.as_div }}
    <p>
      <input type="submit" value="Change" />
    </p>
    {% csrf_token %}
  </form>
{% endblock %}
