{% extends 'base.html' %}
{% load thumbnail %}
{% block title %}
  People
{% endblock %}
{% block content %}
  <h1>People</h1>
  <div id="people-list">
    {% for user in users %}
      <div class="user">
        {% with profile=user.profile %}
          {% if profile.photo %}
            <a href="{{ user.get_absolute_url }}"><img src="{% thumbnail profile.photo 'user_previw' %}" /></a>
          {% endif %}
          <div class="info">
            <a href="{{ user.get_absolute_url }}" class="title">{{ user.get_full_name }}</a>
          </div>
        {% endwith %}
      </div>
    {% endfor %}
  </div>
{% endblock %}
